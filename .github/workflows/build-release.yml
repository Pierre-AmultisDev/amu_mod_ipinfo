name: Build & Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versienummer (bijv. 1.0.0 zonder v)'
        required: true
        type: string

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────
  # Job 1: Build installable ZIP
  # ─────────────────────────────────────
  build:
    name: Build ZIP
    runs-on: ubuntu-latest

    outputs:
      version:  ${{ steps.meta.outputs.version }}
      zip_name: ${{ steps.meta.outputs.zip_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract version
        id: meta
        run: |
          # Bij handmatige trigger: gebruik het ingevulde versienummer
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Bij tag-trigger: haal versie uit de tag (refs/tags/v1.0.0 → 1.0.0)
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # Valideer dat het een geldig versienummer is (X.Y.Z)
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: '${VERSION}' is geen geldig versienummer (verwacht: X.Y.Z)"
            exit 1
          fi
          ZIP_NAME="mod_amu_ipinfo_v${VERSION}.zip"
          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION} | ZIP: ${ZIP_NAME}"

      - name: Patch version into mod_amu_ipinfo.xml
        run: |
          sed -i "s|<version>.*</version>|<version>${{ steps.meta.outputs.version }}</version>|" \
            src/mod_amu_ipinfo/mod_amu_ipinfo.xml

      - name: Build ZIP from src/
        run: |
          cd src
          zip -r "../${{ steps.meta.outputs.zip_name }}" mod_amu_ipinfo/
          cd ..
          ls -lh "${{ steps.meta.outputs.zip_name }}"

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.zip_name }}
          path: ${{ steps.meta.outputs.zip_name }}
          retention-days: 30


  # ─────────────────────────────────────
  # Job 2: Update .joomla/update.xml via GitHub API
  # Geen git checkout/pull/push — voorkomt merge conflicten
  # ─────────────────────────────────────
  update_xml:
    name: Regenerate update.xml
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout (voor het Python script)
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Push update.xml naar GitHub via API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION:      ${{ needs.build.outputs.version }}
          ZIP_NAME:     ${{ needs.build.outputs.zip_name }}
        run: python3 .github/scripts/push_update_xml.py
          DOWNLOAD_URL: https://download.amultis.dev/joomla/modules/amu_ipinfo/${{ needs.build.outputs.zip_name }}
          OUTPUT_PATH:  .joomla/update.xml
        run: python3 .github/scripts/generate_update_xml.py

      - name: Commit update.xml back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .joomla/update.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update.xml for v${{ needs.build.outputs.version }} [skip ci]"
            # Rebase op remote master zodat er nooit een merge conflict ontstaat
            git pull --rebase origin master
            git push origin HEAD:refs/heads/master
          fi

  # ─────────────────────────────────────
  # Job 3: GitHub Release
  # ─────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, update_xml]

    steps:
      - name: Checkout (for CHANGELOG)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download ZIP artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.zip_name }}

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          ESCAPED="${VERSION//./\\.}"
          NOTES=$(awk "/^## \\[?${ESCAPED}\\]?/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md 2>/dev/null || true)
          if [ -z "$NOTES" ]; then
            NOTES="Release v${VERSION}"
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name:   v${{ needs.build.outputs.version }}
          name:       AMU IP Info v${{ needs.build.outputs.version }}
          body:       ${{ steps.changelog.outputs.notes }}
          draft:      false
          prerelease: false
          files:      ${{ needs.build.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────
  # Job 4: Deploy to amultis.dev servers
  # ─────────────────────────────────────
  deploy:
    name: Deploy to amultis.dev
    runs-on: ubuntu-latest
    needs: [build, release]

    steps:
      - name: Checkout (for deploy script)
        uses: actions/checkout@v5

      - name: Download ZIP artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.zip_name }}

      - name: Maak mappen aan op server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            mkdir -p "${{ secrets.DEPLOY_PATH_MODULES }}/amu_ipinfo"
            mkdir -p "${{ secrets.DEPLOY_PATH_UPDATES }}/joomla/modules/amu_ipinfo"

      - name: Upload ZIP to download.amultis.dev via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          source:   ${{ needs.build.outputs.zip_name }}
          target:   ${{ secrets.DEPLOY_PATH_MODULES }}/amu_ipinfo/

      - name: Upload scripts naar server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          source:   .github/scripts/generate_update_xml.py,.github/scripts/deploy_update_xml.sh
          target:   /tmp/amu_deploy/

      - name: Write update.xml on update.amultis.dev via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          envs:     VERSION,ZIP_NAME,UPDATES_PATH
          script: |
            export VERSION="${{ needs.build.outputs.version }}"
            export ZIP_NAME="${{ needs.build.outputs.zip_name }}"
            export UPDATES_PATH="${{ secrets.DEPLOY_PATH_UPDATES }}"
            bash /tmp/amu_deploy/.github/scripts/deploy_update_xml.sh
